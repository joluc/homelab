---
- name: Install K3s on Cloud Control Plane
  hosts: control_plane
  become: true
  tasks:
    - name: Create K3s config directory
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write K3s server config
      copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          # K3s server configuration
          write-kubeconfig-mode: "644"
          disable:
            - traefik
          node-ip: 100.97.29.99
          flannel-iface: tailscale0
        mode: "0644"

    - name: Install K3s Server
      shell: curl -sfL https://get.k3s.io | sh -s - server
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s to be ready
      command: k3s kubectl get nodes
      register: nodes
      until: nodes.rc == 0
      retries: 30
      delay: 2

- name: Join K3s Workers
  hosts: workers
  become: true
  vars:
    k3s_url: "https://100.97.29.99:6443"
  tasks:
    - name: Install K3s Agent
      shell: curl -sfL https://get.k3s.io | K3S_URL={{ k3s_url }} K3S_TOKEN={{ k3s_node_token }} sh -
      args:
        creates: /usr/local/bin/k3s-agent

    - name: Wait for K3s agent to be running
      command: systemctl is-active k3s-agent
      register: k3s_agent_status
      until: k3s_agent_status.rc == 0
      retries: 30
      delay: 5
