---
- name: Setup Tailscale
  hosts: all
  become: true
  vars:
    # tailscale_auth_key is defined in group_vars/secret.yaml (encrypted) or passed via CLI
  tasks:
    - name: Add Tailscale GPG key
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'

    - name: Add Tailscale repository
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list

    - name: Install Tailscale
      apt:
        name: tailscale
        state: present
        update_cache: yes

    - name: Enable IP Forwarding (for subnet routing/exit nodes)
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes

    - name: Bring Tailscale up based on auth key
      command: tailscale up --auth-key={{ tailscale_auth_key }}
      when: tailscale_auth_key is defined and tailscale_auth_key | length > 0
      register: tailscale_up
      changed_when: "'Success' in tailscale_up.stdout or 'Logged in' in tailscale_up.stdout"

    - name: Bring Tailscale up (manual auth required if no key)
      debug:
        msg: "Tailscale installed. Run 'sudo tailscale up' on the node to authenticate if no key was provided."
      when: tailscale_auth_key is not defined or tailscale_auth_key | length == 0
