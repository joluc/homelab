---
- name: Security Hardening
  hosts: all
  become: true
  vars:
    admin_user: joluc
    admin_ssh_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHj/yF9Hg8t8oZvYNrdWCPUuraNDaiC4RdBXwJKDsOVU schwarze.jonathan@gmail.com"

  tasks:
    - name: Ensure admin user exists
      user:
        name: "{{ admin_user }}"
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Set up authorized keys for admin user
      authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ item }}"
      loop: "{{ admin_ssh_keys }}"
      when: admin_ssh_keys | length > 0

    - name: Ensure .ssh directory has correct permissions
      file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0700'

    - name: Copy root SSH keys to admin user (if not provided)
      copy:
        src: /root/.ssh/authorized_keys
        dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0600'
        remote_src: yes
      when: admin_ssh_keys | length == 0
      ignore_errors: yes

    - name: Configure SSH - Disable root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
      notify: restart sshd

    - name: Configure SSH - Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: restart sshd

    - name: Configure SSH - Disable password authentication in cloud-init drop-in
      lineinfile:
        path: /etc/ssh/sshd_config.d/50-cloud-init.conf
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      when: ansible_service_mgr is defined
      ignore_errors: yes
      notify: restart sshd

    - name: Configure SSH - Enable public key authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
        state: present
      notify: restart sshd

    - name: Configure SSH - Disable empty passwords
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        state: present
      notify: restart sshd

    - name: Install security packages
      apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - auditd
          - audispd-plugins
          - lynis
          - rkhunter
          - chkrootkit
        state: present
        update_cache: yes

    - name: Configure unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Enable unattended-upgrades
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Configure fail2ban
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 24h
          findtime = 10m
          maxretry = 3

          [sshd]
          enabled = true
          port = 22
          logpath = /var/log/auth.log
          maxretry = 3
          bantime = 24h
          findtime = 10m
      notify: restart fail2ban

    - name: Enable and start fail2ban
      systemd:
        name: fail2ban
        enabled: yes
        state: started

    - name: Configure kernel security parameters
      copy:
        dest: /etc/sysctl.d/99-security.conf
        content: |
          # IP Forwarding (will be overridden per host)
          net.ipv4.ip_forward = 0
          net.ipv6.conf.all.forwarding = 0

          # Disable IP source routing
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0
          net.ipv6.conf.all.accept_source_route = 0
          net.ipv6.conf.default.accept_source_route = 0

          # Disable ICMP redirects
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv6.conf.all.accept_redirects = 0
          net.ipv6.conf.default.accept_redirects = 0

          # Don't send ICMP redirects
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0

          # Enable SYN flood protection
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_max_syn_backlog = 2048
          net.ipv4.tcp_synack_retries = 2
          net.ipv4.tcp_syn_retries = 5

          # Log suspicious packets
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.default.log_martians = 1

          # Ignore ICMP broadcast requests
          net.ipv4.icmp_echo_ignore_broadcasts = 1

          # Enable reverse path filtering
          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
      notify: reload sysctl

    - name: Enable IP forwarding on gateway nodes
      lineinfile:
        path: /etc/sysctl.d/99-security.conf
        regexp: '^net.ipv4.ip_forward'
        line: 'net.ipv4.ip_forward = 1'
      when: "'gateways' in group_names or 'control_plane' in group_names or 'workers' in group_names"
      notify: reload sysctl

    - name: Configure audit rules
      copy:
        dest: /etc/audit/rules.d/security.rules
        content: |
          # Remove any existing rules
          -D

          # Increase buffer size
          -b 8192

          # Failure mode: 1=print
          -f 1

          # Audit authentication events
          -w /var/log/auth.log -p wa -k auth_log
          -w /var/log/faillog -p wa -k faillog

          # SSH configuration changes
          -w /etc/ssh/sshd_config -p wa -k sshd_config

          # System authentication files
          -w /etc/passwd -p wa -k passwd_changes
          -w /etc/group -p wa -k group_changes
          -w /etc/shadow -p wa -k shadow_changes
          -w /etc/sudoers -p wa -k sudoers_changes
          -w /etc/sudoers.d/ -p wa -k sudoers_changes

          # Monitor for suspicious activity
          -a always,exit -F arch=b64 -S execve -k exec
          -a always,exit -F arch=b64 -S connect -k network_connect

          # Kernel module loading
          -w /sbin/insmod -p x -k modules
          -w /sbin/rmmod -p x -k modules
          -w /sbin/modprobe -p x -k modules

          # System startup scripts
          -w /etc/systemd/ -p wa -k systemd
      notify: reload auditd

    - name: Enable and start auditd
      systemd:
        name: auditd
        enabled: yes
        state: started

    - name: Set UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow Tailscale
      ufw:
        rule: allow
        port: '41641'
        proto: udp

    - name: Allow Tailscale subnet
      ufw:
        rule: allow
        from_ip: 100.64.0.0/10

    - name: Gateway - Allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'
      when: "'gateways' in group_names"

    - name: Control Plane - Allow K3s API from Tailscale only
      ufw:
        rule: allow
        port: '6443'
        proto: tcp
        from_ip: 100.64.0.0/10
      when: "'control_plane' in group_names"

    - name: Control Plane - Allow Traefik HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'
      when: "'control_plane' in group_names"

    - name: Control Plane - Allow Minecraft Java
      ufw:
        rule: allow
        port: '25565'
        proto: tcp
      when: "'control_plane' in group_names"

    - name: Control Plane - Allow Minecraft Bedrock
      ufw:
        rule: allow
        port: '19132'
        proto: udp
      when: "'control_plane' in group_names"

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Create weekly security scan script
      copy:
        dest: /etc/cron.weekly/security-scan
        mode: '0755'
        content: |
          #!/bin/bash
          REPORT_FILE="/var/log/security-scan-$(date +%Y%m%d).log"

          echo "=== Security Scan Report - $(date) ===" > "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

          echo "=== Lynis Audit ===" >> "$REPORT_FILE"
          lynis audit system --quick --quiet >> "$REPORT_FILE" 2>&1

          echo "" >> "$REPORT_FILE"
          echo "=== RKHunter Scan ===" >> "$REPORT_FILE"
          rkhunter --check --skip-keypress --report-warnings-only >> "$REPORT_FILE" 2>&1

          echo "" >> "$REPORT_FILE"
          echo "=== Chkrootkit Scan ===" >> "$REPORT_FILE"
          chkrootkit >> "$REPORT_FILE" 2>&1

          # Keep only last 4 weeks
          find /var/log/security-scan-*.log -mtime +28 -delete

    - name: Update rkhunter database
      command: rkhunter --update
      changed_when: false
      ignore_errors: yes

    - name: Initialize rkhunter database
      command: rkhunter --propupd
      changed_when: false
      ignore_errors: yes

  handlers:
    - name: restart sshd
      systemd:
        name: ssh
        state: restarted

    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted

    - name: reload sysctl
      command: sysctl --system

    - name: reload auditd
      command: augenrules --load
