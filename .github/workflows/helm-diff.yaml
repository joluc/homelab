name: Helm Diff

on:
  pull_request:
    paths:
      - 'kubernetes/**'

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install helm-diff plugin
        run: helm plugin install https://github.com/databus23/helm-diff

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Find changed services
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            kubernetes/**/Chart.yaml
            kubernetes/**/values.yaml

      - name: Show Helm diffs
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "## Helm Diffs" >> $GITHUB_STEP_SUMMARY

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            SERVICE_DIR=$(dirname "$file")
            SERVICE_NAME=$(basename "$SERVICE_DIR")
            CATEGORY=$(basename $(dirname "$SERVICE_DIR"))

            echo "### 📦 $SERVICE_NAME ($CATEGORY)" >> $GITHUB_STEP_SUMMARY

            # Update dependencies
            helm dependency update "$SERVICE_DIR" 2>/dev/null || true

            # Show diff (or skip if not installed)
            if helm list -n "$CATEGORY" | grep -q "$SERVICE_NAME"; then
              echo '```diff' >> $GITHUB_STEP_SUMMARY
              helm diff upgrade "$SERVICE_NAME" "$SERVICE_DIR" \
                --namespace "$CATEGORY" \
                --allow-unreleased 2>&1 | head -100 >> $GITHUB_STEP_SUMMARY || echo "No changes detected" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "✨ New service - will be installed" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Comment PR
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Helm diff completed. Check the workflow summary for details.'
            })
