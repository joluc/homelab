name: Helm Template Diff

on:
  pull_request:
    paths:
      - 'kubernetes/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          path: pr

      - name: Checkout main branch
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          path: main

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: 'latest'

      - name: Find changed charts
        id: changed
        run: |
          cd pr
          CHARTS=""
          for dir in kubernetes/*/*/; do
            # Skip disabled charts
            if [[ "$(basename "$dir")" == _* ]]; then
              continue
            fi
            if [ -f "$dir/Chart.yaml" ]; then
              CHARTS="$CHARTS $dir"
            fi
          done
          echo "charts=$CHARTS" >> $GITHUB_OUTPUT

      - name: Generate diffs
        run: |
          echo "## Helm Template Diff" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for dir in ${{ steps.changed.outputs.charts }}; do
            NAME=$(basename "$dir")

            # Skip if chart doesn't exist in main
            if [ ! -f "main/$dir/Chart.yaml" ]; then
              echo "### $NAME (new chart)" >> $GITHUB_STEP_SUMMARY
              echo "New chart will be added" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              continue
            fi

            # Update dependencies
            helm dependency update "pr/$dir" 2>/dev/null || true
            helm dependency update "main/$dir" 2>/dev/null || true

            # Generate templates
            helm template "$NAME" "main/$dir" > /tmp/main.yaml 2>/dev/null || true
            helm template "$NAME" "pr/$dir" > /tmp/pr.yaml 2>/dev/null || true

            # Show diff
            if ! diff -q /tmp/main.yaml /tmp/pr.yaml > /dev/null 2>&1; then
              echo "### $NAME" >> $GITHUB_STEP_SUMMARY
              echo '```diff' >> $GITHUB_STEP_SUMMARY
              diff -u /tmp/main.yaml /tmp/pr.yaml | head -50 >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Comment on PR
        uses: actions/github-script@v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Helm template diff completed. Check the [workflow summary](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.'
            })
