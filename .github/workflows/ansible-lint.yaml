name: Ansible Lint

on:
  pull_request:
    paths:
      - 'ansible/**'
  push:
    branches:
      - main
    paths:
      - 'ansible/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.3.0
        with:
          args: "ansible/"
