name: Ansible Lint

on:
  pull_request:
    paths:
      - 'ansible/**'
  push:
    branches:
      - main
    paths:
      - 'ansible/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v24
        with:
          args: "ansible/"
