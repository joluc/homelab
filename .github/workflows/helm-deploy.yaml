name: Helm Lint

on:
  pull_request:
    paths:
      - 'kubernetes/**'
  push:
    branches:
      - main
    paths:
      - 'kubernetes/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: 'latest'

      - name: Lint Charts
        run: |
          FAILED=0
          for dir in kubernetes/*/*/; do
            # Skip disabled charts (prefixed with _)
            if [[ "$(basename "$dir")" == _* ]]; then
              echo "Skipping disabled: $dir"
              continue
            fi

            if [ -f "$dir/Chart.yaml" ]; then
              echo "Linting $dir..."

              # Update dependencies if Chart.yaml has dependencies
              if grep -q "dependencies:" "$dir/Chart.yaml"; then
                helm dependency update "$dir" 2>/dev/null || true
              fi

              if ! helm lint "$dir"; then
                FAILED=1
              fi
            fi
          done

          exit $FAILED
