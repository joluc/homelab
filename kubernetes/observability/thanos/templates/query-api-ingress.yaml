apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thanos-query-api
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: thanos-thanos-basicauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: thanos-api.joluc.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thanos-query
                port:
                  name: http
