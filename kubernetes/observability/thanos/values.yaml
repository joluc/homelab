global:
  security:
    allowInsecureImages: true

thanos:
  # Use official Thanos image
  image:
    registry: quay.io
    repository: thanos/thanos
    tag: v0.42.4

  # Object storage configuration
  objstoreConfig: |-
    type: S3
    config:
      bucket: thanos
      endpoint: garage.garage.svc.cluster.local:3900
      access_key: GK0913bdac0d23b5e53352d7ed
      secret_key: 5c131018596fe40a8db156e31691309e9e1d39bad7f5fd2ae24261fb9fac3e3e
      insecure: true
      signature_version2: false
      http_config:
        insecure_skip_verify: true

  # Querier - queries data from sidecars and object storage
  query:
    enabled: true
    replicaCount: 1
    stores:
      - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.kube-prometheus-stack.svc.cluster.local
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Query Frontend - caching layer for querier
  queryFrontend:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Store Gateway - serves historical data from object storage
  storegateway:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # Compactor - compacts and downsamples blocks
  compactor:
    enabled: true
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # Disable components we don't need
  ruler:
    enabled: false

  # Receive - accepts remote write from Prometheus (basic auth)
  receive:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: true
      storageClass: local-path
      size: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    ingress:
      enabled: true
      hostname: thanos-receive.joluc.de
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: thanos-thanos-basicauth@kubernetescrd

  receiveDistributor:
    enabled: false

  # Metrics configuration
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
