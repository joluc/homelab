apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
spec:
  forwardAuth:
    address: http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:80/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - Authorization
