kube-prometheus-stack:
  # Add Specter label to all PrometheusRules
  defaultRules:
    labels:
      specter.joluc.de/enabled: "true"
    # Disable rule groups that don't work on K3s
    rules:
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeProxy: false

  # Enable CRD installation
  crds:
    enabled: true

  # Disable admission webhooks to avoid sync issues
  prometheusOperator:
    admissionWebhooks:
      enabled: false

  prometheus:
    enabled: true
    prometheusSpec:
      retention: 15d

      # Pick up all ServiceMonitors and PodMonitors across all namespaces
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}

      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      # Pick up all PrometheusRules across all namespaces
      ruleSelectorNilUsesHelmValues: false
      ruleSelector: {}
      ruleNamespaceSelector: {}

      # Storage for Prometheus data
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            resources:
              requests:
                storage: 50Gi

      # Resource limits
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      # Thanos sidecar for long-term storage
      thanos:
        image: quay.io/thanos/thanos:v0.37.1
        objectStorageConfig:
          existingSecret:
            name: thanos-objstore-config
            key: objstore.yml

    # Enable Thanos components for querying from object storage
    thanosService:
      enabled: true
    thanosServiceMonitor:
      enabled: true

  # Thanos Ruler disabled - Prometheus handles alerting rules
  thanosRuler:
    enabled: false

  grafana:
    enabled: true

    # Ingress configuration
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      hosts:
        - "" # will be overriden in homelab-secrets

    # Persistence for dashboards
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Admin credentials (change these!)
    adminPassword: "" # will be overriden in homelab-secrets

    # Use Thanos Query as the default Prometheus datasource
    defaultDatasourceEnabled: false
    additionalDataSources:
      - name: Thanos
        type: prometheus
        url: http://thanos-query-frontend.thanos.svc.cluster.local:9090
        access: proxy
        isDefault: true
      - name: Prometheus (local)
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090
        access: proxy
        isDefault: false

    # Dashboard sidecar configuration - allow UI dashboard creation/editing
    sidecar:
      dashboards:
        provider:
          allowUiUpdates: true

  # Alertmanager configuration
  alertmanager:
    enabled: true

    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            resources:
              requests:
                storage: 5Gi

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    config:
      route:
        receiver: pagerduty
        group_by: ['alertname', 'namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: 'null'
            matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
          - receiver: 'null'
            matchers:
              - severity = "none"
          - receiver: pagerduty
            matchers:
              - severity =~ "critical|warning"

      receivers:
        - name: 'null'
        - name: pagerduty
          pagerduty_configs:
            - routing_key: ""  # set in homelab-secrets
              severity: '{{ or .CommonLabels.severity "warning" }}'
              description: '{{ or .CommonAnnotations.summary .CommonLabels.alertname }}'
              details:
                alertname: '{{ .CommonLabels.alertname }}'
                namespace: '{{ .CommonLabels.namespace }}'
              links:
                - href: '{{ .CommonAnnotations.specter_joluc_de_logs }}'
                  text: 'Logs'
                - href: '{{ .CommonAnnotations.specter_joluc_de_dashboard }}'
                  text: 'Dashboard'

# Thanos object storage (Garage S3)
thanosObjstore:
  bucket: thanos
  endpoint: garage.garage.svc.cluster.local:3900
  accessKey: ""   # will be overridden in homelab-secrets
  secretKey: ""   # will be overridden in homelab-secrets
  insecure: true
