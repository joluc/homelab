# User passwords (override in homelab-secrets)
userPasswords: {}
  # logs: "password-here"

operator:
  enabled: true
  manager:
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi

cluster:
  enabled: true
  cluster:
    name: opensearch
    general:
      version: 3.5.0
      httpPort: 9200
      vendor: opensearch
      serviceName: opensearch
      monitoring:
        enable: true
        scrapeInterval: 30s
        pluginUrl: https://github.com/opensearch-project/opensearch-prometheus-exporter/releases/download/3.5.0.0/prometheus-exporter-3.5.0.0.zip
        tlsConfig:
          insecureSkipVerify: true
      additionalConfig:
        cluster.initial_cluster_manager_nodes: opensearch-nodes-0

    nodePools:
      - component: nodes
        replicas: 2
        diskSize: "200Gi"
        roles:
          - "cluster_manager"
          - "data"
          - "ingest"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        persistence:
          pvc:
            storageClass: local-path
            accessModes:
              - ReadWriteOnce

    security:
      tls:
        transport:
          generate: true
          perNode: true
        http:
          generate: true
      config:
        securityConfigSecret:
          name: opensearch-security-config

    dashboards:
      replicas: 1
      version: 3.5.0
      pluginsList:
        - https://github.com/joluc/opensearch-link/releases/download/v3.5.0.0/opensearch-link-3.5.0.0.zip
      additionalConfig:
        opensearch_security.auth.type: "openid"
        opensearch_security.auth.unauthenticated_routes: '[ "/api/link", "/api/reporting/stats" ]'
        opensearch_security.openid.connect_url: "" # Will be set in homelab-secrets
        opensearch_security.openid.client_id: "" # Will be set in homelab-secrets
        opensearch_security.openid.client_secret: "" # Will be set in homelab-secrets
        opensearch_security.openid.base_redirect_url: "" # Will be set in homelab-secrets
        # Enable new Dashboards experience (https://github.com/opensearch-project/OpenSearch-Dashboards/issues/10490)
        data_source.enabled: "true"
        workspace.enabled: "true"
        savedObjects.permission.enabled: "true"
        opensearchDashboards.dashboardAdmin.users: '["joluc"]'
        opensearch.ignoreVersionMismatch: "true"
        data.savedQueriesNewUI.enabled: "true"
        explore.enabled: "true"
        opensearchDashboards.branding.useExpandedHeader: "false"
        uiSettings.overrides.theme:version: v9
        uiSettings.overrides.home:useNewHomePage: "true"
        uiSettings.overrides.query:enhancements:enabled: "true"

  # ISM Policies - defined at cluster level, not cluster.cluster
  ismPolicies:
    - name: logs-retention-policy
      defaultState: hot
      description: "Logs policy with 1-year retention and 10GB rollover"
      states:
        - name: hot
          actions:
            - rollover:
                minSize: 10gb
          transitions:
            - stateName: delete
              conditions:
                minIndexAge: 365d
        - name: delete
          actions:
            - delete: {}
      ismTemplate:
        priority: 100
        indexPatterns:
          - "logs-*"

  # Roles - defined at cluster level
  roles:
    - name: logs
      clusterPermissions:
        - cluster_composite_ops
        - cluster_monitor
      indexPermissions:
        - indexPatterns:
            - logs-*
            - otel-logs-*
            - .opendistro-ism-*
          allowedActions:
            - indices_all
            - crud
            - create_index
            - manage

  # Users - defined at cluster level
  users:
    - name: logs
      secretName: logs-password
      secretKey: password
      backendRoles:
        - logs
      opendistroSecurityRoles:
        - logs

  # Index Templates - defined at cluster level
  indexTemplates:
    - name: logs
      indexPatterns:
        - logs-*
      priority: 200
      dataStream: {}
      templateSpec:
        settings:
          index:
            number_of_shards: 1
            number_of_replicas: 0
            refresh_interval: 5s
            codec: best_compression
        mappings:
          properties:
            "@timestamp":
              type: date
            observedTimestamp:
              type: date
            body:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 1024
            severity:
              properties:
                text:
                  type: keyword
                number:
                  type: integer
            instrumentationScope:
              properties:
                name:
                  type: keyword
                version:
                  type: keyword
            trace_id:
              type: keyword
            span_id:
              type: keyword
            attributes:
              properties:
                log.file.path:
                  type: keyword
                log.iostream:
                  type: keyword
                logtag:
                  type: keyword
                data_stream.dataset:
                  type: keyword
                data_stream.namespace:
                  type: keyword
                data_stream.type:
                  type: keyword
            resource:
              properties:
                k8s.namespace.name:
                  type: keyword
                k8s.pod.name:
                  type: keyword
                k8s.pod.uid:
                  type: keyword
                k8s.pod.start_time:
                  type: date
                k8s.container.name:
                  type: keyword
                k8s.container.restart_count:
                  type: integer
                k8s.node.name:
                  type: keyword
                k8s.deployment.name:
                  type: keyword
                k8s.daemonset.name:
                  type: keyword
                k8s.statefulset.name:
                  type: keyword
                k8s.replicaset.name:
                  type: keyword
                k8s.job.name:
                  type: keyword
                k8s.cronjob.name:
                  type: keyword
                service.name:
                  type: keyword
                service.version:
                  type: keyword
