operator:
  enabled: true
  manager:
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi

cluster:
  enabled: true
  cluster:
    name: opensearch
    general:
      version: 3.5.0
      httpPort: 9200
      vendor: opensearch
      serviceName: opensearch
      monitoring:
        enable: true
        scrapeInterval: 30s
        pluginUrl: https://github.com/opensearch-project/opensearch-prometheus-exporter/releases/download/3.5.0.0/prometheus-exporter-3.5.0.0.zip
        tlsConfig:
          insecureSkipVerify: true
      additionalConfig:
        cluster.initial_cluster_manager_nodes: opensearch-nodes-0

    nodePools:
      - component: nodes
        replicas: 1
        diskSize: "200Gi"
        roles:
          - "cluster_manager"
          - "data"
          - "ingest"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        persistence:
          pvc:
            storageClass: local-path
            accessModes:
              - ReadWriteOnce

    security:
      tls:
        transport:
          generate: true
          perNode: true
        http:
          generate: true
      config:
        securityConfigSecret:
          name: opensearch-security-config

    dashboards:
      enabled: true
      replicas: 1
      version: 3.5.0
      enableTls: false
      additionalConfig:
        opensearch_security.auth.type: "openid"
        opensearch_security.openid.connect_url: "" # Will be set in homelab-secrets
        opensearch_security.openid.client_id: "" # Will be set in homelab-secrets
        opensearch_security.openid.client_secret: "" # Will be set in homelab-secrets
        opensearch_security.openid.base_redirect_url: "" # Will be set in homelab-secrets

    ismPolicies:
      - name: logs-retention-policy
        defaultState: hot
        description: "Logs policy with 7-day retention and 40GB rollover"
        states:
          - name: hot
            actions:
              - rollover:
                  minSize: "40gb"
                  minIndexAge: "1d"
            transitions:
              - stateName: delete
                conditions:
                  minIndexAge: "7d"
          - name: delete
            actions:
              - delete: {}
        ismTemplate:
          indexPatterns:
            - "logs-*"
          priority: 100

    roles:
      - name: logs
        clusterPermissions:
          - cluster_composite_ops
          - cluster_monitor
        indexPermissions:
          - indexPatterns:
              - logs-*
              - otel-logs-*
              - .opendistro-ism-*
            allowedActions:
              - indices_all
              - crud
              - create_index
              - manage

    users:
      - name: logs
        passwordSecretRef:
          name: logs-password
          key: password
        backendRoles:
          - logs
        opendistroSecurityRoles:
          - logs
