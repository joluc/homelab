apiVersion: opensearch.opster.io/v1
kind: OpensearchIndexTemplate
metadata:
  name: logs
  namespace: {{ .Release.Namespace }}
spec:
  opensearchCluster:
    name: opensearch
  name: logs
  indexPatterns:
    - logs-*
  dataStream: {}
  priority: 200
  template:
    settings:
      index:
        number_of_shards: 1
        number_of_replicas: 0
        refresh_interval: 5s
        codec: best_compression
    mappings:
      properties:
        "@timestamp":
          type: date
        observedTimestamp:
          type: date
        body:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 1024
        severity:
          properties:
            text:
              type: keyword
            number:
              type: integer
        instrumentationScope:
          properties:
            name:
              type: keyword
            version:
              type: keyword
        trace_id:
          type: keyword
        span_id:
          type: keyword
        # Attributes - common log metadata
        attributes:
          properties:
            log.file.path:
              type: keyword
            log.iostream:
              type: keyword
            logtag:
              type: keyword
            data_stream.dataset:
              type: keyword
            data_stream.namespace:
              type: keyword
            data_stream.type:
              type: keyword
        # Resource - Kubernetes metadata (flattened for better querying)
        resource:
          properties:
            k8s.namespace.name:
              type: keyword
            k8s.pod.name:
              type: keyword
            k8s.pod.uid:
              type: keyword
            k8s.pod.start_time:
              type: date
            k8s.container.name:
              type: keyword
            k8s.container.restart_count:
              type: integer
            k8s.node.name:
              type: keyword
            k8s.deployment.name:
              type: keyword
            k8s.daemonset.name:
              type: keyword
            k8s.statefulset.name:
              type: keyword
            k8s.replicaset.name:
              type: keyword
            k8s.job.name:
              type: keyword
            k8s.cronjob.name:
              type: keyword
            service.name:
              type: keyword
            service.version:
              type: keyword
