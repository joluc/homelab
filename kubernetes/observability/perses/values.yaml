perses:
  config:
    security:
      enable_auth: true
      cookie:
        same_site: lax
        secure: true

  image:
    registry: docker.io
    name: persesdev/perses
    version: latest

  sidecar:
    enabled: true
    label: "perses.dev/resource"
    labelValue: "true"
    globalAdminUsers:
      - "" # will be overridden in homelab-secrets with your OIDC username/email

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: "" # will be overriden in homelab-secrets
        paths:
          - path: /
            pathType: Prefix

  persistence:
    enabled: true
    storageClass: local-path
    size: 2Gi

  resources:
    requests:
      memory: 100Mi
      cpu: 100m
    limits:
      memory: 200Mi
      cpu: 200m
