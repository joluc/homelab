perses:
  image:
    registry: docker.io
    name: persesdev/perses
    version: v0.49.1

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: "" # will be overriden in homelab-secrets
        paths:
          - path: /
            pathType: Prefix

  persistence:
    enabled: true
    storageClass: local-path
    size: 2Gi

  resources:
    requests:
      memory: 100Mi
      cpu: 100m
    limits:
      memory: 200Mi
      cpu: 200m
