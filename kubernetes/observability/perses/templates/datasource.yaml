apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-datasource
  namespace: perses
  labels:
    perses.dev/resource: "true"
data:
  datasource.yaml: |
    kind: GlobalDatasource
    metadata:
      name: prometheus-datasource
      project: perses
    spec:
      default: true
      plugin:
        kind: PrometheusDatasource
        spec:
          directUrl: http://thanos-query.thanos:9090
