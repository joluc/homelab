apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-datasource
  namespace: perses
  labels:
    perses.dev/resource: "true"
data:
  datasource.yaml: |
    kind: Datasource
    metadata:
      name: prometheus-datasource
      project: infra
    spec:
      default: true
      plugin:
        kind: PrometheusDatasource
        spec:
          proxy:
            kind: HTTPProxy
            spec:
              url: http://thanos-query.thanos:9090
