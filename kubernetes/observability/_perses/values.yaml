perses:
  image:
    repository: perses/perses
    tag: latest

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: perses.joluc.de
        paths:
          - path: /

  persistence:
    enabled: true
    storageClass: local-path
    size: 2Gi

  resources:
    requests:
      memory: 100Mi
      cpu: 100m
    limits:
      memory: 200Mi
      cpu: 200m
