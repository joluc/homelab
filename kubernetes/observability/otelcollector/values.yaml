# OpenTelemetry Collector values
opentelemetry-collector:
  mode: daemonset

  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.114.0"

  presets:
    kubernetesAttributes:
      enabled: true
    kubeletMetrics:
      enabled: true
    hostMetrics:
      enabled: false

  config:
    extensions:
      basicauth/opensearch:
        client_auth:
          username: logs
          password: ${OPENSEARCH_PASSWORD}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      syslog:
        tcp:
          listen_address: "0.0.0.0:54526"
        udp:
          listen_address: "0.0.0.0:54526"
        protocol: rfc5424
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/otelcollector_*/*/*
          - /var/log/pods/kube-system_*/*/*
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
            max_log_size: 102400
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 30s
              static_configs:
                - targets: ['0.0.0.0:8888']

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

    exporters:
      debug:
        verbosity: detailed
      opensearch:
        http:
          endpoint: https://opensearch.opensearch.svc.cluster.local:9200
          auth:
            authenticator: basicauth/opensearch
          tls:
            insecure_skip_verify: true
        logs_index: logs-otel

    service:
      extensions: [health_check, basicauth/opensearch]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp, filelog, syslog]
          processors: [memory_limiter, batch]
          exporters: [opensearch, debug]

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      hostPort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    syslog:
      enabled: true
      containerPort: 54526
      servicePort: 54526
      protocol: TCP
    syslog-udp:
      enabled: true
      containerPort: 54526
      servicePort: 54526
      protocol: UDP
    prometheus:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

  tolerations: []

  extraEnvs:
    - name: OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: logs-password
          key: password

  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers

  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true

