# OpenTelemetry Collector values
opentelemetry-collector:
  mode: daemonset

  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.158.0"

  presets:
    kubernetesAttributes:
      enabled: true
    kubeletMetrics:
      enabled: true
    hostMetrics:
      enabled: false

  config:
    extensions:
      basicauth/opensearch:
        client_auth:
          username: logs
          password: ${OPENSEARCH_PASSWORD}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      k8s_events:
        auth_type: serviceAccount
        namespaces: []  # All namespaces
      k8sobjects:
        auth_type: serviceAccount
        objects:
          - name: pods
            mode: pull
            interval: 30s
          - name: events
            mode: watch
          - name: deployments
            mode: pull
            interval: 30s
          - name: services
            mode: pull
            interval: 30s
          - name: configmaps
            mode: pull
            interval: 30s
          - name: secrets
            mode: pull
            interval: 30s
      syslog:
        tcp:
          listen_address: "0.0.0.0:54526"
        udp:
          listen_address: "0.0.0.0:54526"
        protocol: rfc5424
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/otelcollector_*/*/*
          - /var/log/pods/kube-system_*/*/*
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
            max_log_size: 102400
          - type: json_parser
            id: json-parser
            parse_from: body
            parse_to: attributes
            on_error: send
          - type: key_value_parser
            id: logfmt-parser
            parse_from: body
            parse_to: attributes
            on_error: send
            if: 'body matches "^time=\""'
          - type: regex_parser
            id: rust-log-parser
            regex: '^(?:\x1b\[[0-9;]*m)*(?P<timestamp>[0-9T:.Z-]+)(?:\x1b\[[0-9;]*m)* (?:\x1b\[[0-9;]*m)*(?P<level>[A-Z]+)(?:\x1b\[[0-9;]*m)* (?:\x1b\[[0-9;]*m)*(?P<module>[^\s:]+)(?:\x1b\[[0-9;]*m)*:\s*(?P<message>.*)$'
            parse_from: body
            parse_to: attributes
            on_error: send
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 30s
              static_configs:
                - targets: ['0.0.0.0:8888']

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

    exporters:
      debug:
        verbosity: detailed
      opensearch:
        http:
          endpoint: https://opensearch.opensearch.svc.cluster.local:9200
          auth:
            authenticator: basicauth/opensearch
          tls:
            insecure_skip_verify: true
        logs_index: logs-otel

    service:
      extensions: [health_check, basicauth/opensearch]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp, filelog, syslog, k8s_events, k8sobjects]
          processors: [memory_limiter, batch]
          exporters: [opensearch, debug]

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      hostPort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    syslog:
      enabled: true
      containerPort: 54526
      servicePort: 54526
      hostPort: 54526
      protocol: TCP
    syslog-udp:
      enabled: true
      containerPort: 54526
      servicePort: 54526
      hostPort: 54526
      protocol: UDP
    prometheus:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

  tolerations: []

  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources:
          - events
          - pods
          - services
          - configmaps
          - secrets
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources:
          - deployments
        verbs: ["get", "list", "watch"]

  extraEnvs:
    - name: OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: logs-password
          key: password

  extraVolumes:
    - name: pods
      hostPath:
        path: /var/log/pods

  extraVolumeMounts:
    - name: pods
      mountPath: /var/log/pods
      readOnly: true

