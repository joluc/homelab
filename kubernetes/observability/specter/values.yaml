specter:
  controller:
    logLevel: info
    logFormat: json

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 50Mi

  # Enable shortener and ingress (URLs/hosts configured in homelab-secrets)
  shortener:
    enabled: true

  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

# ClusterSpecterConfig values (overridden in homelab-secrets)
clusterConfig:
  environment: ""
  indexPattern: ""
  templates:
    logs:
      url: ""
    dashboard:
      url: ""
