openbao:
  # Disable injector to save resources (enable later if needed)
  injector:
    enabled: false

  server:
    # Standalone mode: use PostgreSQL backend
    standalone:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "postgresql" {
          connection_url = "" # Injected via BAO_PG_CONNECTION_URL
        }

    # Inject connection string from secret
    extraSecretEnvironmentVars:
      - envName: BAO_PG_CONNECTION_URL
        secretName: openbao-db-creds
        secretKey: connection_url

    # Ingress via Traefik
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      hosts:
        - host: "" # will be overridden in homelab-secrets

    # Persistent storage disabled (using Postgres)
    dataStorage:
      enabled: false
      storageClass: standard
      size: 5Gi

    # Resource limits for homelab
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # Enable the web UI
  ui:
    enabled: true
