---
# Immich backup schedule
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: immich-backup
  namespace: immich
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo-password
      key: password
    s3:
      endpoint: {{ .Values.s3.endpoint }}
      bucket: {{ .Values.s3.bucket }}
      accessKeyIDSecretRef:
        name: k8up-s3-credentials
        key: username
      secretAccessKeySecretRef:
        name: k8up-s3-credentials
        key: password

  # Backup Immich PVCs daily at 2 AM
  backup:
    schedule: '0 2 * * *'
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2

  # Check backup integrity weekly
  check:
    schedule: '0 4 * * 1'

  # Prune - keep 7 daily backups
  prune:
    schedule: '0 5 * * *'
    retention:
      keepDaily: 7
