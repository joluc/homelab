---
# S3 credentials secret reference (will be created in secrets repo)
apiVersion: v1
kind: Secret
metadata:
  name: k8up-s3-credentials
  namespace: k8up
type: Opaque
stringData:
  username: {{ .Values.s3.accessKeyId | quote }}
  password: {{ .Values.s3.secretAccessKey | quote }}
---
# Restic repository password (will be overridden in secrets repo)
apiVersion: v1
kind: Secret
metadata:
  name: k8up-repo-password
  namespace: k8up
type: Opaque
stringData:
  password: {{ .Values.restic.password | quote }}
