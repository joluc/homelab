---
# Secret copies for K8up in each namespace
# K8up needs S3 credentials and repo password in each namespace where backups run

{{- $namespaces := list "postgres" "immich" "paperless" "minecraft-java" "nextcloud" }}
{{- range $namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: k8up-s3-credentials
  namespace: {{ . }}
type: Opaque
stringData:
  username: {{ $.Values.s3.accessKeyId | quote }}
  password: {{ $.Values.s3.secretAccessKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: k8up-repo-password
  namespace: {{ . }}
type: Opaque
stringData:
  password: {{ $.Values.restic.password | quote }}
{{- end }}
