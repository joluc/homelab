garage:
  replicaCount: 1

  image:
    tag: v1.0.0

  # Persistence for data (S3 objects)
  persistence:
    enabled: true
    storageClass: standard
    size: 100Gi

  # Garage configuration
  # See full values: https://github.com/garagehq/helm-charts/blob/main/charts/garage/values.yaml
  garage:
    replication_factor: 1  # For single node setup, or 3 for HA

  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: "" # will be overriden in homelab-secrets
        paths:
          - path: /
            pathType: Prefix

  # Node affinity to pin to VPS (edge-compute)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node_role
            operator: In
            values:
            - edge-compute

  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
