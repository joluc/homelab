metallb:
  # IP address pool for LoadBalancer services
  # Apply this after MetalLB is installed:
  # kubectl apply -f metallb-config.yaml

  controller:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  speaker:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
