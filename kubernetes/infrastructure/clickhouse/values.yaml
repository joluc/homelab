clickhouse:
  auth:
    username: "default"
    password: "" # will be overridden in homelab-secrets

  # Single shard, single replica for homelab
  shards: 1
  replicaCount: 1

  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi

  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 2Gi
      cpu: 1000m

  # Reduce logging verbosity
  configuration: |
    <clickhouse>
        <logger>
            <level>warning</level>
            <console>true</console>
        </logger>
        <query_thread_log remove="remove"/>
        <query_log remove="remove"/>
        <text_log remove="remove"/>
        <trace_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
    </clickhouse>

  # Init script to create Plausible database
  initdbScripts:
    init-plausible.sql: |
      CREATE DATABASE IF NOT EXISTS plausible_events_db;
