velero:
  # Use legacy kubectl image (bitnami/kubectl doesn't have 1.34 yet)
  kubectl:
    image:
      repository: docker.io/bitnamilegacy/kubectl

  # Disable upgradeCRDs job (image doesn't exist for k8s 1.34)
  upgradeCRDs: false

  # Backup to MinIO (S3-compatible)
  configuration:
    backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      config:
        region: minio
        s3ForcePathStyle: "true"
        s3Url: http://minio.default.svc.cluster.local:9000

    # No volume snapshots for now
    volumeSnapshotLocation: []

  # Credentials for MinIO
  credentials:
    useSecret: true
    secretContents:
      cloud: "" # will be overriden in homelab-secrets

  # Schedule daily backups at 2 AM
  schedules:
    daily:
      schedule: "0 2 * * *"
      template:
        ttl: "720h"  # 30 days
        includedNamespaces:
        - "*"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
