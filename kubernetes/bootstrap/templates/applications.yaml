{{- range .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .name }}-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ $.Values.repoURL }}
        revision: {{ $.Values.targetRevision }}
        directories:
          - path: {{ .path }}/*
          - path: {{ .path }}/_*
            exclude: true
  template:
    metadata:
      name: '{{ `{{ .path.basename }}` }}'
    spec:
      project: default
      sources:
        - repoURL: 'https://github.com/joluc/homelab-secrets.git'
          targetRevision: main
          ref: secrets
        - repoURL: {{ $.Values.repoURL }}
          targetRevision: {{ $.Values.targetRevision }}
          path: '{{ `{{ .path.path }}` }}'
          helm:
            valueFiles:
              - '$secrets/{{ `{{ .path.path }}` }}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ if .namespace }}{{ .namespace }}{{ else }}'{{ `{{ .path.basename }}` }}'{{ end }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
{{- end }}
