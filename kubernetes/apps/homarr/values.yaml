dbCredentials:
  dbEncryptionKey: ""  # will be overridden in homelab-secrets
  dbUrl: ""  # will be overridden in homelab-secrets

homarr:
  dbCredentials:
    existingSecret: "homarr-db-secret"
    dbEncryptionKey: "db-encryption-key"
    dbUrlKey: "db-url"

  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - host: "" # will be overridden in homelab-secrets
        paths:
          - path: /
            pathType: Prefix

  persistence:
    data:
      enabled: true
      storageClass: local-path
      size: 2Gi
    config:
      enabled: true
      storageClass: local-path
      size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
