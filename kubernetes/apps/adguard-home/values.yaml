image:
  repository: adguard/adguardhome
  tag: latest

ingress:
  enabled: true
  host: "" # will be overriden in homelab-secrets

persistence:
  config:
    enabled: true
    storageClass: standard
    size: 1Gi
  data:
    enabled: true
    storageClass: standard
    size: 5Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
