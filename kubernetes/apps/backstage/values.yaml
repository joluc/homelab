# Configuration for the backstage subchart
backstage:
  # Enable ingress
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    host: "" # overridden in homelab-secrets

  # Backstage application config
  backstage:
    # Use custom image with OIDC support
    image:
      registry: docker.io
      repository: joluc/backstage-custom
      tag: latest
      pullPolicy: Always

    # Used for app-config.yaml generation
    appConfig:
      app:
        baseUrl: "" # overridden in homelab-secrets
        title: Joluc Homelab

      backend:
        baseUrl: "" # overridden in homelab-secrets
        database:
          client: pg
          connection:
            host: "" # overridden in homelab-secrets
            port: 5432
            database: backstage
            user: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
            # user/password injected via secrets/env vars
        auth:
          keys:
            - secret: ${AUTH_SESSION_SECRET}

      # Auth configuration
      auth:
        environment: production
        providers:
          oidc:
            development:
              metadataUrl: ${OIDC_METADATA_URL}
              clientId: ${OIDC_CLIENT_ID}
              clientSecret: ${OIDC_CLIENT_SECRET}
              prompt: auto
              signIn:
                resolvers:
                  - resolver: emailMatchingUserEntityProfileEmail
            production:
              metadataUrl: ${OIDC_METADATA_URL}
              clientId: ${OIDC_CLIENT_ID}
              clientSecret: ${OIDC_CLIENT_SECRET}
              prompt: auto
              signIn:
                resolvers:
                  - resolver: emailMatchingUserEntityProfileEmail

      # Integrations
      integrations:
        github:
          - host: github.com
            # token injected via secrets

      # Catalog
      catalog:
        rules:
          - allow: [Component, System, API, Resource, Location, User, Group]
        locations:
          # Local users catalog
          - type: file
            target: /catalog/users.yaml
          # Load examples
          - type: url
            target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

  # Postgres Configuration (if using the subchart)
  postgresql:
    enabled: false # We use external or sqlite for now to save resources

  # Resource limits (adjust based on usage)
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
