      icon: dashboard
    - url: https://grafana.joluc.de/d/home-assistant
      title: Grafana Dashboard
      icon: graph
  annotations:
    github.com/project-slug: joluc/homelab
    backstage.io/kubernetes-id: home-assistant
spec:
  type: service
  lifecycle: production
  owner: homelab-team
  system: homelab-applications
  dependsOn:
    - component:default/postgres
    - component:default/redis
  providesApis: []
