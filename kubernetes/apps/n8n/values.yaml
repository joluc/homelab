image:
  repository: n8nio/n8n
  tag: "2.34.1"

ingress:
  enabled: true
  host: "" # will be overriden in homelab-secrets

persistence:
  enabled: true
  storageClass: local-path
  size: 5Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

nodeSelector:
  node-role.kubernetes.io/worker: "true"

env:
  N8N_PORT: "5678"
  N8N_HOST: "" # will be overriden in homelab-secrets
  N8N_PROTOCOL: https
  WEBHOOK_URL: "" # will be overriden in homelab-secrets
  GENERIC_TIMEZONE: Europe/Berlin
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres-postgresql.postgres.svc.cluster.local
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: "" # will be overriden in homelab-secrets
  DB_POSTGRESDB_PASSWORD: "" # will be overriden in homelab-secrets
