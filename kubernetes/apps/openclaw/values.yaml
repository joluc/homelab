openclaw:
  nameOverride: "krabbe"
  fullnameOverride: "krabbe"

  image:
    repository: "joluc/krabbe"
    tag: "2026.4.21"

  openclaw:
    agents:
      defaults:
        model: "llama-local"
        thinkingDefault: "low"
        timeoutSeconds: 600
    configOverrides:
      ai:
        providers:
          - name: llama-local
            type: openai-compatible
            baseUrl: "http://192.168.1.217:8080/v1"
            models:
              - name: llama-local
      browser:
        cdpUrl: "http://localhost:9222"
      gateway:
        mode: "local"
        controlUi:
          allowedOrigins:
            - "https://krabbe.joluc.de"

  ingress:
    enabled: true
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: ImplementationSpecific
