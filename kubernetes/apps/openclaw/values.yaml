openclaw:
  nameOverride: "krabbe"
  fullnameOverride: "krabbe"

  image:
    tag: "2026.2.25"

  openclaw:
    agents:
      defaults:
        model: "openai-codex/gpt-5.3-codex"
        thinkingDefault: "low"
        timeoutSeconds: 600
    configOverrides:
      browser:
        cdpUrl: "http://localhost:9222"
      gateway:
        mode: "local"
        controlUi:
          allowedOrigins:
            - "https://krabbe.joluc.de"

  ingress:
    enabled: true
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: ImplementationSpecific
