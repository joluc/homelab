openclaw:
  nameOverride: "krabbe"
  fullnameOverride: "krabbe"

  image:
    tag: "2026.2.25"

  openclaw:
    agents:
      defaults:
        model: "openai-codex/gpt-5.3-codex"
        thinkingDefault: "low"
        timeoutSeconds: 600
    configOverrides:
      browser:
        cdpUrl: "http://localhost:9222"
      gateway:
        mode: "local"
        controlUi:
          allowedOrigins:
            - "https://krabbe.joluc.de"
      hooks:
        mappings:
          - name: alertmanager
            to: agent
            transform:
              message: |
                You are a Kubernetes cluster monitoring assistant. Analyze the following alert(s) from Alertmanager and provide:
                1. A clear summary of what's wrong
                2. The potential impact
                3. Recommended actions to resolve it

                Alert Details:
                {{#each alerts}}
                - Status: {{status}}
                - Alert: {{labels.alertname}}
                - Severity: {{labels.severity}}
                - Namespace: {{labels.namespace}}
                {{#if labels.pod}}- Pod: {{labels.pod}}{{/if}}
                {{#if labels.container}}- Container: {{labels.container}}{{/if}}
                - Summary: {{annotations.summary}}
                - Description: {{annotations.description}}
                {{#if annotations.runbook_url}}- Runbook: {{annotations.runbook_url}}{{/if}}

                {{/each}}

                Please provide a concise analysis and actionable recommendations.

  ingress:
    enabled: true
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: ImplementationSpecific
