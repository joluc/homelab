openclaw:
  nameOverride: "krabbe"
  fullnameOverride: "krabbe"

  image:
    tag: "2026.2.25"

  openclaw:
    agents:
      defaults:
        model: "anthropic/claude-sonnet-4-20250514"
        thinkingDefault: "low"
        timeoutSeconds: 600
    configOverrides:
      browser:
        cdpUrl: "http://localhost:9222"
      gateway:
        mode: "local"
        controlUi:
          allowedOrigins:
            - "https://krabbe.joluc.de"

  # Install kubectl for cluster management
  extraInitContainers:
    - name: install-kubectl
      image: alpine:3.19
      command:
        - sh
        - -c
        - |
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /kubectl-bin/
      volumeMounts:
        - name: kubectl-bin
          mountPath: /kubectl-bin

  extraVolumes:
    - name: kubectl-bin
      emptyDir: {}

  extraVolumeMounts:
    - name: kubectl-bin
      mountPath: /usr/local/bin/kubectl
      subPath: kubectl

  ingress:
    enabled: true
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: ImplementationSpecific
