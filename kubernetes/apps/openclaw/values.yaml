openclaw:
  nameOverride: "krabbe"
  fullnameOverride: "krabbe"

  image:
    tag: "2026.2.25"

  openclaw:
    agents:
      defaults:
        model: "openai-codex/gpt-5.3-codex"
        thinkingDefault: "low"
        timeoutSeconds: 600
    configOverrides:
      browser:
        cdpUrl: "http://localhost:9222"
      gateway:
        mode: "local"
        controlUi:
          allowedOrigins:
            - "https://krabbe.joluc.de"
      hooks:
        mappings:
          alertmanager:
            to: wake
            transform:
              text: |
                🚨 **Cluster Alert**

                {{#each alerts}}
                **{{status}}**: {{labels.alertname}}
                {{#if labels.severity}}Severity: {{labels.severity}}{{/if}}
                {{#if labels.namespace}}Namespace: {{labels.namespace}}{{/if}}
                {{#if annotations.summary}}{{annotations.summary}}{{/if}}
                {{#if annotations.description}}
                {{annotations.description}}
                {{/if}}

                {{/each}}

  ingress:
    enabled: true
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: ImplementationSpecific
