apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krabbe-cluster-operator
  labels:
    app.kubernetes.io/name: krabbe
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
# Read-only access to cluster resources
- apiGroups: [""]
  resources: ["pods", "services", "nodes", "events", "persistentvolumeclaims", "persistentvolumes", "configmaps", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
# Healing operations - restart pods and scale deployments
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "patch", "update"]
# Pod logs for debugging
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
# Metrics access
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
# ArgoCD applications (read-only)
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "watch"]
# Ingress resources
- apiGroups: ["networking.k8s.io", "traefik.io", "traefik.containo.us"]
  resources: ["ingresses", "ingressroutes", "middlewares"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krabbe-cluster-operator-binding
  labels:
    app.kubernetes.io/name: krabbe
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
- kind: ServiceAccount
  name: krabbe
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: krabbe-cluster-operator
  apiGroup: rbac.authorization.k8s.io
