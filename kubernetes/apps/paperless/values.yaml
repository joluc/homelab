paperless-ngx:
  # Persistence for documents
  persistence:
    data:
      enabled: true
      storageClass: local-path
      size: 20Gi
    media:
      enabled: true
      storageClass: local-path
      size: 50Gi

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - host: "" # will be overriden in homelab-secrets
        paths:
          - path: /
            pathType: Prefix

  # Configure external PostgreSQL
  postgresql:
    internal:
      enabled: false
    external:
      enabled: true
      host: postgres-postgresql.postgres.svc.cluster.local
      port: 5432
    secret:
      enabled: false # We will provide credentials via options (or could use existing secret)
    options:
      username: "" # will be overriden in homelab-secrets
      database: paperless
      password: "" # will be overriden in homelab-secrets

  # Configure external Redis
  redis:
    internal:
      enabled: false
    external:
      enabled: true
      host: redis-master.redis.svc.cluster.local
      port: "6379"  # Use string to avoid Go formatting issues
      # Note: Redis password is usually part of the URL.
      # The chart helper `redis.url` constructs `redis://user:pass@host:port`
      # if we configure it correctly?
      # Let's check helper if needed. But for now we put just host/port.
      # Bitnami redis uses password.

  # Main application configuration
  main:
    # Override PAPERLESS_REDIS directly to fix port formatting issue
    environments:
      - name: PAPERLESS_REDIS
        value: "redis://redis-master.redis.svc.cluster.local:6379"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
