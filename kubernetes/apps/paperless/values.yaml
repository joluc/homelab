image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  tag: "3.1.3"

# Nextcloud integration
nextcloud:
  enabled: true
  webdavUrl: "https://nextcloud.joluc.de/remote.php/dav/files"
  consumeFolder: "Paperless" # Folder name in Nextcloud to watch for documents
  # Credentials will be configured via app password or service account

# PostgreSQL configuration
postgresql:
  host: postgres-postgresql.postgres.svc.cluster.local
  port: "5432"
  database: paperless
  username: "" # will be overridden in homelab-secrets
  password: "" # will be overridden in homelab-secrets

# Redis configuration
redis:
  host: redis-master.redis.svc.cluster.local
  port: "6379"
  url: "" # will be overridden in homelab-secrets

# Paperless configuration
paperlessUrl: "https://docs.joluc.de"
appSecret: "my_strong_secret"

# Ingress
ingress:
  enabled: true
  host: "" # will be overridden in homelab-secrets

# Persistence
persistence:
  storageClass: local-path
  size: 20Gi

# Resources
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# OIDC Configuration
oidc:
  providers: {} # will be overridden in homelab-secrets
