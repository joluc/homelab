# Backstage Configuration

# Global ingress settings
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  hosts:
    - host: backstage.joluc.de
      paths:
        - path: /
          pathType: Prefix

# Backstage application config
backstage:
  # Used for app-config.yaml generation
  appConfig:
    app:
      baseUrl: https://backstage.joluc.de
      title: Joluc Homelab
    backend:
      baseUrl: https://backstage.joluc.de
      # database:
      #   client: better-sqlite3
      #   connection: ':memory:'
      # For production with Postgres:
      # For production with Postgres:
      database:
        client: pg
        connection:
          host: postgresql.database.svc.cluster.local
          port: 5432
          user: backstage
          password: backstage
    # Integrations
    integrations:
      github:
        - host: github.com
          # token: ${GITHUB_TOKEN} # Inject via secret

    # Catalog
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location]
      locations:
        # Load local examples or configured locations
        - type: url
          target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

# Postgres Configuration (if using the subchart)
postgresql:
  enabled: false # We use external or sqlite for now to save resources

# Resource limits (adjust based on usage)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
