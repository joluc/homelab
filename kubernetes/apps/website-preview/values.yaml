image:
  repository: ghcr.io/joluc/website
  tag: "latest"
  pullPolicy: Always

replicaCount: 2

# The ingress is fronted by oauth2-proxy-website-preview; that oauth2-proxy
# owns the preview.joluc.de host and proxies to this service.
service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

nodeSelector:
  node-role.kubernetes.io/worker: "true"
