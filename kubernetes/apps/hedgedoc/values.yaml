image:
  repository: quay.io/hedgedoc/hedgedoc
  tag: "1.10.0-alpine"

ingress:
  enabled: true
  host: "" # will be overriden in homelab-secrets

persistence:
  enabled: true
  storageClass: local-path
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  CMD_DB_URL: "" # will be overriden in homelab-secrets
  CMD_DOMAIN: "" # will be overriden in homelab-secrets
  CMD_PROTOCOL_USESSL: "false"
  CMD_URL_ADDPORT: "false"
  # Guest mode for easy sharing with friends
  CMD_ALLOW_ANONYMOUS: "true"
  CMD_ALLOW_ANONYMOUS_EDITS: "true"
  # Security: Prevent abuse
  CMD_ALLOW_FREEURL: "false"  # Only random URLs, prevents name squatting
  CMD_REQUIRE_FREEURL_AUTHENTICATION: "true"  # Custom URLs need auth
