apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  TELEGRAM_ALLOWED_USERS: {{ .Values.config.telegramAllowedUsers | quote }}
  HERMES_INFERENCE_PROVIDER: "llamacpp"
  {{- if .Values.config.customEndpoint }}
  HERMES_CUSTOM_ENDPOINT: {{ .Values.config.customEndpoint | quote }}
  {{- end }}
