apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  TELEGRAM_ALLOWED_USERS: {{ .Values.config.telegramAllowedUsers | quote }}
  HERMES_INFERENCE_PROVIDER: {{ .Values.config.inferenceProvider | default "openai-codex" | quote }}
  HERMES_INFERENCE_MODEL: {{ .Values.config.inferenceModel | default "gpt-5.5" | quote }}
