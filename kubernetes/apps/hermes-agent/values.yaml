image:
  repository: nousresearch/hermes-agent
  tag: v2026.8.3
  pullPolicy: Always

replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: control-01

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

persistence:
  storageClass: local-path
  size: 5Gi

secrets:
  telegramBotToken: ""      # will be overridden in homelab-secrets

config:
  telegramAllowedUsers: ""  # will be overridden in homelab-secrets
