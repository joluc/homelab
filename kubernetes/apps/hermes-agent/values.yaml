image:
  repository: nousresearch/hermes-agent
  tag: v2026.8.3
  pullPolicy: Always

replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: control-01

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

persistence:
  storageClass: local-path
  size: 5Gi

secrets:
  telegramBotToken: ""      # will be overridden in homelab-secrets

config:
  telegramAllowedUsers: ""  # will be overridden in homelab-secrets
  inferenceProvider: "openai-codex"
  inferenceModel: "gpt-5.5"  # ChatGPT Plus Codex: gpt-5.3-codex/gpt-5.4 currently broken (OpenAI-side, Nov 2026); gpt-5.5 works
