minecraft:
  replicaCount: 1

  # Run on VPS (edge-compute node)
  nodeSelector:
    node_role: edge-compute

  # Minecraft Java server configuration
  minecraftServer:
    eula: "TRUE"
    version: "LATEST"
    type: "PAPER"
    difficulty: normal
    maxPlayers: 12
    motd: "" # will be overridden in homelab-secrets
    ops: "j0luc"
    enableCommandBlock: true
    spawnProtection: 0
    viewDistance: 16
    memory: 2048M
    jvmXXOpts: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200"
    pluginUrls:
      - https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar
      - https://github.com/sladkoff/minecraft-prometheus-exporter/releases/download/v3.1.2/minecraft-prometheus-exporter-3.1.2.jar
      - https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.7.3-SNAPSHOT%2B933/PAPER/ViaVersion-5.7.3-SNAPSHOT.jar
    # Service configuration for Java
    serviceType: LoadBalancer
    loadBalancerIP: 10.0.10.26
    externalTrafficPolicy: Local

  # Persistence for world data
  persistence:
    dataDir:
      enabled: true
      storageClass: local-path
      Size: 10Gi

  # Always overwrite paper-world-defaults.yml before Paper starts.
  # Overwriting (not conditional) ensures settings apply even if Paper previously
  # created the file with anti-xray disabled.
  initContainers:
    - name: paper-antixray-config
      image: busybox
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          mkdir -p /data/config
          cp /paper-config/paper-world-defaults.yml /data/config/paper-world-defaults.yml
      volumeMounts:
        - name: datadir
          mountPath: /data
        - name: paper-antixray-config
          mountPath: /paper-config

  # Declare the ConfigMap as a pod volume (no main-container mount needed)
  extraVolumes:
    - volumes:
        - name: paper-antixray-config
          configMap:
            name: minecraft-java-paper-antixray

  # ConfigMap containing the initial paper-world-defaults.yml with anti-xray enabled.
  # engine-mode 1: replaces hidden ores with fake stone (low overhead)
  # engine-mode 2: obfuscates all blocks until player is nearby (better, more CPU)
  extraDeploy:
    - |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: minecraft-java-paper-antixray
        namespace: {{ .Release.Namespace }}
      data:
        paper-world-defaults.yml: |
          anticheat:
            anti-xray:
              enabled: true
              engine-mode: 2
              max-block-height: 64
              update-radius: 2
              lava-obscures: false
              use-permission: false
              hidden-blocks:
                - copper_ore
                - deepslate_copper_ore
                - raw_copper_block
                - gold_ore
                - deepslate_gold_ore
                - iron_ore
                - deepslate_iron_ore
                - raw_iron_block
                - coal_ore
                - deepslate_coal_ore
                - lapis_ore
                - deepslate_lapis_ore
                - mossy_cobblestone
                - obsidian
                - chest
                - diamond_ore
                - deepslate_diamond_ore
                - redstone_ore
                - deepslate_redstone_ore
                - clay
                - emerald_ore
                - deepslate_emerald_ore
                - ender_chest
              replacement-blocks:
                - stone
                - oak_planks
                - deepslate

  # Expose Prometheus exporter plugin port
  extraPorts:
    - name: metrics
      containerPort: 9940
      protocol: TCP
      service:
        enabled: false

  podAnnotations:
    kubectl.kubernetes.io/restartedAt: "2026-03-24T12:00:00Z"

  # Resource limits (keep low requests, reasonable limit to avoid OOM killing cluster)
  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 2000m
      memory: 3Gi
