hedgedoc:
  # Persistence for uploads
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - host: notes.joluc.de
        paths:
          - path: /
            pathType: Prefix

  # PostgreSQL database
  postgresql:
    enabled: false

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Environment variables
  env:
    CMD_DOMAIN: notes.joluc.de
    CMD_PROTOCOL_USESSL: "false"  # Caddy handles TLS
    CMD_URL_ADDPORT: "false"
    CMD_DB_URL: "postgres://hedgedoc:hedgedoc@postgresql.database.svc.cluster.local:5432/hedgedoc"
