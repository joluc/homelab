minecraft:
  # Run on VPS (edge-compute node)
  nodeSelector:
    node_role: edge-compute

  # Minecraft Bedrock server configuration
  minecraftServer:
    eula: "TRUE"
    version: "LATEST"
    difficulty: normal
    maxPlayers: 20
    serverName: "" # will be overridden in homelab-secrets
    # Bedrock uses port 19132 UDP by default
    gamemode: survival
    levelName: world

  # Service configuration
  serviceType: LoadBalancer
  loadBalancerIP: 10.0.10.25
  externalTrafficPolicy: Local

  # Persistence for world data
  persistence:
    dataDir:
      enabled: true
      storageClass: local-path
      size: 10Gi

  # Resource limits (minimal for scheduling on constrained nodes)
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 3Gi

  # Backups with Velero
  podAnnotations:
    backup.velero.io/backup-volumes: datadir
