minecraft:
  # Run on VPS (edge-compute node)
  nodeSelector:
    node_role: edge-compute

  # Minecraft Bedrock server configuration
  minecraftServer:
    eula: "TRUE"
    version: "LATEST"
    difficulty: normal
    maxPlayers: 12
    serverName: "" # will be overridden in homelab-secrets
    gamemode: survival
    levelName: "Bedrock level"
    levelSeed: "365998300168920"
    # Service configuration for Bedrock
    serviceType: LoadBalancer
    loadBalancerIP: 10.0.10.25
    externalTrafficPolicy: Local

  # Persistence for world data
  persistence:
    dataDir:
      enabled: true
      storageClass: local-path
      size: 10Gi

  # Resource limits (minimal for scheduling on constrained nodes)
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 3Gi
