image:
  repository: ghcr.io/pocket-id/pocket-id
  tag: v2

ingress:
  enabled: true
  host: "" # will be overriden in homelab-secrets

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  PUBLIC_APP_URL: "" # will be overriden in homelab-secrets
  ENCRYPTION_KEY: "" # will be overriden in homelab-secrets
  # Using SQLite by default - database stored in /app/data PVC
