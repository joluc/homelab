image:
  repository: ghcr.io/pocket-id/pocket-id
  tag: v2.12.0

ingress:
  enabled: true
  host: "" # will be overriden in homelab-secrets

persistence:
  enabled: false  # Disabled when using external Postgres database
  storageClass: local-path
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi

# Pocket-ID is on the critical path for every OIDC login across the cluster.
# Keep it off the 1GB Pi 3 nodes (pi-04, pi-05) where it was OOM-throttled to
# 5s+ token exchange latency, breaking Paperless (5s read timeout).
nodeSelector:
  node-role.kubernetes.io/worker: "true"
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - pi-04
                - pi-05

env:
  APP_URL: "" # will be overriden in homelab-secrets
  TRUST_PROXY: "false" # will be overriden in homelab-secrets
  ENCRYPTION_KEY: "" # will be overriden in homelab-secrets
  DB_CONNECTION_STRING: "" # will be overriden in homelab-secrets - set to postgres:// URL for external database
